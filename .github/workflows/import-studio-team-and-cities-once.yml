name: Import IMVO team drawing and African city labels once
on:
  push:
    branches:
      - feat/studio-closer-map-floating-notes-team-cms-20261020
    paths:
      - .github/workflows/import-studio-team-and-cities-once.yml
permissions:
  contents: write
jobs:
  import-approved-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Download and validate user team sketch and city coordinates
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 --silent --show-error "https://d2ol7oe51mr4n9.cloudfront.net/user_3ENlEezMenC2lRloW59bpB2N77p/22e0f024-b40f-4705-85db-db9a6915a096.png" -o /tmp/imvo-team-sketch.png
          echo "36c073fd1de79bcbb89d9d5ac92d1c9befd81767dbb5ed5a23d3d0535de0a1c9  /tmp/imvo-team-sketch.png" | sha256sum -c -
          curl --fail --location --retry 3 --max-time 180 --silent --show-error "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_populated_places.geojson" -o /tmp/africa-populated-places.geojson
          test $(stat -c%s /tmp/africa-populated-places.geojson) -gt 10000000
      - name: Convert exact supplied team artwork and generate labeled cities
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check Pillow
          mkdir -p public/studio
          python - <<'PY'
          from PIL import Image
          image=Image.open('/tmp/imvo-team-sketch.png').convert('RGB')
          image.save('public/studio/team-composite.webp','WEBP',quality=86,method=6)
          print('Approved team montage size:', image.size)
          PY
          python scripts/import-africa-city-points.py /tmp/africa-populated-places.geojson
          test -s public/studio/team-composite.webp
          test $(stat -c%s app/studio-canvas/africaCityPoints.ts) -gt 18000
      - name: Commit verified assets into the existing IMVO site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/studio/team-composite.webp app/studio-canvas/africaCityPoints.ts
          if ! git diff --cached --quiet; then
            git commit -m "Install supplied team drawing and geographically verified African city labels"
            git push origin HEAD:feat/studio-closer-map-floating-notes-team-cms-20261020
          fi
