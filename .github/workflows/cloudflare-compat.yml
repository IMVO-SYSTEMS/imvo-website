name: Cloudflare compatibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "sanity/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "next.config.ts"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-compat.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint report
        continue-on-error: true
        run: npm run lint

      - name: Next.js build
        run: npm run build:next

      - name: Cloudflare compatibility
        run: npx vinext check

      - name: Cloudflare production build
        run: npm run build:cloudflare
