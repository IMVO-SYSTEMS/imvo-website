name: Prepare Cloudflare deployment

on:
  push:
    branches:
      - chore/cloudflare-migration-20261001
    paths:
      - ".github/workflows/cloudflare-bootstrap.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/cloudflare-migration-20261001
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align React runtime
        run: npm install --save-exact react@19.2.8 react-dom@19.2.8 react-server-dom-webpack@19.2.8

      - name: Generate Cloudflare Wrangler configuration
        run: |
          npx --yes vinext@latest init --platform=cloudflare --legacy-wrangler-cloudflare-init --cdn-cache=none --data-cache=none --image-optimization=none --skip-check --no-install
          npm pkg set scripts.build:next="next build"
          npm pkg set scripts.build:cloudflare="vite build"
          npm pkg set scripts.deploy:cloudflare="wrangler deploy --keep-vars"
          npm install --package-lock-only

      - name: Commit migration configuration
        run: |
          git config user.name "IMVO Systems Migration"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json .gitignore vite.config.ts wrangler.jsonc
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: prepare IMVO website for Cloudflare"
          git push origin HEAD:chore/cloudflare-migration-20261001
