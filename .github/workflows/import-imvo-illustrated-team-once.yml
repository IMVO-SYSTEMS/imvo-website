name: Import approved illustrated IMVO team banner once

on:
  push:
    branches:
      - feat/country-closeups-testimonials-cms-20261020
    paths:
      - .github/workflows/import-imvo-illustrated-team-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch exact team illustration provided by the owner
        env:
          FILE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3ENlEezMenC2lRloW59bpB2N77p/22db5c41-9a15-46fc-b37d-f3d36baffe39.png
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 120 "$FILE_URL" -o /tmp/imvo-team-approved.png
          echo "36c073fd1de79bcbb89d9d5ac92d1c9befd81767dbb5ed5a23d3d0535de0a1c9  /tmp/imvo-team-approved.png" | sha256sum -c -
      - name: Install existing image tooling and make optimized WebP
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --input-type=module -e "import sharp from 'sharp'; await sharp('/tmp/imvo-team-approved.png').rotate().resize({width:1586,withoutEnlargement:true}).webp({quality:82,effort:5}).toFile('public/studio-team-illustrated.webp');"
          test -s public/studio-team-illustrated.webp
          ls -lh public/studio-team-illustrated.webp
      - name: Commit approved artwork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/studio-team-illustrated.webp
          if ! git diff --cached --quiet; then
            git commit -m "Install original approved IMVO team group illustration"
            git push origin "HEAD:feat/country-closeups-testimonials-cms-20261020"
          fi
